<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
</head>
<body>

    <h1>Edit Expense</h1>

    <form action="{{ url_for('edit_expense', expense_id=expense.id) }}" method="POST">

        <label>Title:</label>
        <input type="text" name="title" value="{{ expense.title }}" required>
        <br><br>

        <label>Amount:</label>
        <input type="number" name="amount" step="0.01" value="{{ expense.amount }}" required>
        <br><br>

        <label>Category:</label>
        <input type="text" name="category" value="{{ expense.category }}" required>
        <br><br>

        <label>Date:</label>
        <input type="date" name="expense_date" value="{{ expense.expense_date }}" required>
        <br><br>

        <label>Notes:</label>
        <textarea name="notes">{{ expense.notes }}</textarea>
        <br><br>

        <button type="submit">Update Expense</button>

    </form>
</body>
</html>
