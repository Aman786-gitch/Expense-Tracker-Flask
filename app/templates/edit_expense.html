<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense | Expense Tracker</title>

    <link rel="stylesheet"href="{{ url_for('static', filename='css/edit_expense.css') }}">
</head>
<body>

    <nav class="navbar">

    <h2>Expense Tracker</h2>

    <div class="nav-links">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('view_expenses') }}">Expenses</a>
        <a href="{{ url_for('add_expenses_form') }}">Add Expense</a>
    </div>

</nav>


<main class="container">

    <div class="page-heading">
        <h1>Edit Expense</h1>
        <p>Update the details of your expense.</p>
    </div>


    <div class="form-card">

        <form action="{{ url_for('edit_expense', expense_id=expense.id) }}"
              method="POST">

            <div class="form-group">

                <label for="title">Expense Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ expense.title }}"
                    placeholder="Enter expense title"
                    required>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="amount">Amount</label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0"
                        value="{{ expense.amount }}"
                        placeholder="Enter amount"
                        required>

                </div>


                <div class="form-group">

                    <label for="expense_date">Date</label>

                    <input
                        type="date"
                        id="expense_date"
                        name="expense_date"
                        value="{{ expense.expense_date }}"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="category">Category</label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    value="{{ expense.category }}"
                    placeholder="e.g. Food, Travel, Shopping"
                    required>

            </div>


            <div class="form-group">

                <label for="notes">Notes</label>

                <textarea
                    id="notes"
                    name="notes"
                    placeholder="Add any additional notes...">{{ expense.notes }}</textarea>

            </div>


            <div class="form-actions">

                <a href="{{ url_for('view_expenses') }}"
                   class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="update-btn">
                    Update Expense
                </button>

            </div>

        </form>

    </div>

</main>
</body>
</html>
