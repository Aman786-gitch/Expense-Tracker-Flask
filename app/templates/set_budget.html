<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Budget | Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

    <nav class="navbar">

        <h2>Expense Tracker</h2>

        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('view_expenses') }}">Expenses</a>
            <a href="{{ url_for('add_expenses_form') }}">Add Expense</a>
        </div>

    </nav>


    <div class="budget-form-container">

        <h1>Set Monthly Budget</h1>

        <p>Set your spending limit for this month.</p>

        <form method="POST">

            <label for="amount">Monthly Budget</label>

            <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="1"
                placeholder="Enter budget amount"
                required
            >

            <button type="submit">Save Budget</button>

        </form>

    </div>

</body>

</html>
